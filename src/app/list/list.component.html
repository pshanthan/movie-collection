<form [formGroup]="movieForm" (ngSubmit)="onSubmit()">
  <input formControlName="title" />
  <input formControlName="director" />
  <input formControlName="runtime" />
  <input formControlName="releaseDate" />
  <input type="checkbox" formControlName="watched" />
  <button type="submit">SUBMIT</button>
</form>

<div *ngFor="let m of movies">
  {{ m.title }} - {{ m.director }} - {{ m.runtime | runtime }} -
  {{ m.releaseDate }} -
  {{ m.watched }}
  <button (click)="startEdit(m)">EDIT</button>
  <button (click)="deleteMovie(m.id!)">DELETE</button>
</div>
